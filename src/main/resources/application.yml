# ============================================================
# NovaBlog — Multi-Tenant SaaS Blogging Platform
# Default Configuration
# ============================================================

spring:
  application:
    name: novablog

  # ----------------------------------------------------------
  # JPA / Hibernate — Multi-Tenancy
  # ----------------------------------------------------------
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none  # Flyway manages all schema changes
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        multi_tenancy: SCHEMA
        multi_tenant_connection_provider: com.novablog.multitenancy.SchemaBasedMultiTenantConnectionProvider
        tenant_identifier_resolver: com.novablog.multitenancy.CurrentTenantIdentifierResolverImpl
    show-sql: false

  # ----------------------------------------------------------
  # Datasource
  # ----------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:novablog}
    username: ${PGUSER:novablog}
    password: ${PGPASSWORD:novablog}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # ----------------------------------------------------------
  # Flyway — Public schema migrations only (tenant migrations
  # are handled programmatically via TenantSchemaProvisioner)
  # ----------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration/public
    schemas:
      - public
    baseline-on-migrate: true

  # ----------------------------------------------------------
  # Security — OAuth2 Client Registration
  # ----------------------------------------------------------
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:mock-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:mock-google-client-secret}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/callback/google}
            scope: openid,email,profile
          github:
            client-id: ${GITHUB_CLIENT_ID:mock-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:mock-github-client-secret}
            redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:3000/auth/callback/github}
            scope: user:email

# ----------------------------------------------------------
# Server Configuration
# ----------------------------------------------------------
server:
  port: 8080
  servlet:
    context-path: /

# ----------------------------------------------------------
# Actuator
# ----------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ----------------------------------------------------------
# SpringDoc / OpenAPI
# ----------------------------------------------------------
springdoc:
  api-docs:
    path: /api/v1/docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# ----------------------------------------------------------
# NovaBlog Custom Properties
# ----------------------------------------------------------
novablog:
  tenant:
    default-timezone: UTC
    schema-prefix: tenant_
    migration-location: classpath:db/migration/tenant

  # JWT Configuration
  jwt:
    # Base64-encoded 256-bit secret (CHANGE IN PRODUCTION!)
    # Generated with: openssl rand -base64 32
    secret: ${JWT_SECRET:dGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIGp3dCB0b2tlbnM=}
    access-token-expiration-ms: 900000     # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
    issuer: novablog

  # Media Storage
  media:
    s3-bucket: ${S3_BUCKET_NAME:novablog-media-local}

  # ----------------------------------------------------------
  # Spring Cloud AWS
  # ----------------------------------------------------------
  # ----------------------------------------------------------
  # Spring Cloud AWS
  # ----------------------------------------------------------
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: mock-access-key
        secret-key: mock-secret-key
      s3:
        endpoint: https://s3.us-east-1.amazonaws.com
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  # ----------------------------------------------------------
  # Multipart File Upload
  # ----------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB


# ----------------------------------------------------------
# Logging
# ----------------------------------------------------------
logging:
  level:
    root: INFO
    com.novablog: DEBUG
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
