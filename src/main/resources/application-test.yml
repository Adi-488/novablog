# ============================================================
# NovaBlog — Test Profile (Testcontainers PostgreSQL)
# ============================================================

spring:
  datasource:
    # Testcontainers dynamically sets URL, username, password
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration/public
    schemas:
      - public
    clean-disabled: false

  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.novablog: DEBUG
    org.testcontainers: INFO
